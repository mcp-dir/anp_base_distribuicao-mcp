# Smithery configuration for ANP: Base de Distribuição
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_anp_base_distribuicao

name: anp_base_distribuicao-mcp
displayName: "ANP: Base de Distribuição"
description: >
  ANP: Base de Distribuição, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/anp_base_distribuicao-mcp
repository: https://github.com/mcp-dir/anp_base_distribuicao-mcp

tags:
  - anp_base_distribuicao
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_anp_base_distribuicao

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_anp_base_distribuicao/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
